# Render Blueprint: AgentTag Web Service + Cloud Relay
# Docs: https://render.com/docs/blueprint-spec

services:
  # 1. AgentTag Main Web App & Dashboard (Next.js 14)
  - type: web
    name: agenttag-web
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set your Neon Serverless Postgres Connection String in Render dashboard
      - key: FIRECRAWL_API_KEY
        sync: false # Optional: Set your Firecrawl API key
      - key: NEXT_PUBLIC_RELAY_URL
        value: https://agenttag-relay.onrender.com
      - key: NEXT_PUBLIC_CDN_URL
        value: https://agenttag-web.onrender.com

  # 2. AgentTag Cloud Relay (Real-time WebSockets & SSE for Claude / Cursor)
  - type: web
    name: agenttag-relay
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install
    startCommand: npm run relay
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Same Neon Database connection string
      - key: PORT
        value: 10000
